name: Docker Desktop acceptance
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Self-hosted Docker Desktop runner label (macOS-ARM64 or Windows-WSL2)'
        required: true
        type: choice
        options: [macOS-ARM64, Windows-WSL2]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: [self-hosted, '${{ inputs.platform }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python tools/acceptance.py
