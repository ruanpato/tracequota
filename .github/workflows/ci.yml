name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m tracequota pricing validate
        env:
          PYTHONPATH: apps/api
      - run: python -m pytest -q
      - run: python tools/check_docs.py
      - run: python -m ruff check apps/api examples tools tests
      - run: python -m ruff format --check apps/api examples tools tests
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=moderate
        working-directory: apps/web
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: tracequota
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tracequota_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U tracequota -d tracequota_test" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tracequota:test-only@localhost:5432/tracequota_test
      DATABASE_URL: postgresql+psycopg://tracequota:test-only@localhost:5432/tracequota_test
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m pytest -q
      - run: python -c "from tracequota.db import Base, engine; Base.metadata.drop_all(engine)"
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: python tools/check_dashboard_sql.py
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose config --quiet
      - run: python tools/acceptance.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/tracequota-${{ matrix.app }}:ci
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r apps/api/requirements.lock
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln,secret
