    max_stale: 24h
  batch:
    timeout: 1s
    send_batch_size: 256
  filter/private_events:
    error_mode: propagate
    traces:
      spanevent:
      - 'true'
exporters:
  otlp_http/phoenix:
    endpoint: http://tracequota-api:8000/phoenix
    compression: none
  otlp_http/ledger:
    endpoint: http://tracequota-api:8000
    compression: none
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
service:
  extensions:
  - health_check
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/privacy
      - filter/private_events
      - batch
      exporters:
      - otlp_http/phoenix
      - otlp_http/ledger
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/privacy
      - batch
      exporters:
      - otlp_http/ledger
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/privacy
      - deltatocumulative
      - batch
      exporters:
      - prometheus
      - otlp_http/ledger
